#@     # ------------------------------------------------------------------
#@     # 站点根 /
#@     #
#@     # 【关于是否需要 SPA fallback 的结论：不需要】
#@     #   依据：
#@     #   1) src/ 全量检索 history.pushState / replaceState / location.hash / 路由库 → 零命中，
#@     #      不存在任何前端路由；
#@     #   2) index.html 是单文件全量入口，所有界面（title/HUD/升级/技能树/图鉴/宠物/血裔）
#@     #      都预写在这一个 HTML 里，运行时靠增删 .hidden class 切换显隐，URL 从不变化；
#@     #   3) 无深链接需求，玩家只会访问 / ；
#@     #   4) 产物里的 _redirects（/* /index.html 200）是 Cloudflare Pages 模板残留，
#@     #      不是本项目真实需求；
#@     #   5) 真 404 更有诊断价值：若做 SPA fallback，缺失的 PNG/JS 会返回 200 + HTML，
#@     #      浏览器只报模糊的 MIME 错误，165 张图的场景下排查成本极高。
#@     #
#@     #   因此这里使用「真 404」，不做 fallback。
#@     #   `/` 本身由 index index.html; 正常落到 /index.html。
#@     #
#@     #   ⚠️ 若将来引入前端路由（可分享深链接如 /codex），把下面这一行换成：
#@     #      try_files $uri $uri/ /index.html;
#@     # ------------------------------------------------------------------
#@     location / {
#@         try_files $uri $uri/ =404;
#@     }
#@
#@     # 自定义 404（可选）：如需更友好，放置 404.html 到产物根目录后取消注释
#@     # error_page 404 /404.html;
#@     # location = /404.html { internal; }
#@ }
