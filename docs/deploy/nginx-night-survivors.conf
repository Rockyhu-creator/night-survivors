# ==============================================================================
# 《夜裔幸存者》Night Survivors —— Nginx 配置模板（两阶段）
# 目标：腾讯云轻量应用服务器（Lighthouse）+ Nginx 静态托管（纯静态站点，无后端、无前端路由）
#
# ⚠️ 2026-10-08 前提修正：产品已从「云服务器 CVM」更正为
#    「轻量应用服务器 Lighthouse」（实例 lhins-475yjttw / 上海 / Ubuntu 22.04 LTS）。
#    端口放行走轻量控制台左侧「防火墙」标签页（轻量没有「安全组」概念）。
#
# ------------------------------------------------------------------------------
# 【两阶段使用顺序 —— 顺序不能反】
#
#   阶段一 HTTP-only（重装后立刻可用；此时还没有证书）
#     · 渲染/拷贝下方 STAGE1 段落
#     · 作用：① 验证站点能被访问 ② 为 certbot 的 HTTP-01 挑战留好 80 端口通道
#     · 对应命令：
#         bash docs/deploy/deploy.sh --init         # 全新机器首次初始化（装 nginx、建目录、写阶段一）
#         bash docs/deploy/deploy.sh --http-only    # 发版 + 保持阶段一 + HTTP 冒烟
#
#   阶段二 HTTPS（拿到证书之后再切）
#     · 先 certbot webroot 拿证（阶段一已为挑战留好 /.well-known/acme-challenge/）
#     · 再渲染/拷贝下方 STAGE2 段落，替换阶段一
#     · 对应命令：
#         bash docs/deploy/deploy.sh --https        # 拿证 + 切阶段二 + reload + HTTPS 冒烟
#     · 等价手工：
#         sudo certbot certonly --webroot -w /var/www/night-survivors/current \
#              -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#
#   ⚠️ 没有证书就直接上 STAGE2 → nginx -t 会因为找不到 pem 而失败，nginx 起不来。
#   ⚠️ 证书路径默认按 certbot（/etc/letsencrypt/live/<域名>/）写；
#      若用腾讯云免费证书，把 ssl_certificate / ssl_certificate_key 两行改成
#      /etc/nginx/ssl/<域名>/fullchain.pem 与 privkey.pem。
#
# ------------------------------------------------------------------------------
# 手工使用方式（不用脚本时）
#   1) 把 STAGE1（或 STAGE2）段落整段拷到 /etc/nginx/conf.d/night-survivors.conf
#   2) STAGE2 段落里每行开头的 "#@ " 是渲染标记 —— 手工拷贝时把这些 "#@ " 去掉
#      （deploy.sh --https 会自动去掉；行首是单个 "#" 的是真注释，保留即可）
#   3) 全局替换占位符 YOUR_DOMAIN → 真实域名
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# 占位符清单：
#   YOUR_DOMAIN          真实域名（deploy.sh 用 $DOMAIN 自动替换）
#   /etc/letsencrypt/live/YOUR_DOMAIN/   certbot 证书路径（或改腾讯云证书路径）
#   /var/www/night-survivors/current     站点根目录（软链接，指向 releases/<时间戳>）
#                                        （deploy.sh 用 $REMOTE_DIR 自动替换前缀）
#
# 配套文档：docs/deploy/tencent-lighthouse-deploy.md
# ==============================================================================


# ------------------------------------------------------------------------------
# 缓存策略映射表（公共段，两阶段都要；必须放在 http 上下文 —— conf.d/*.conf 就是在 http 里 include 的）
#
# 为什么用 map 而不是在各个 location 里写 add_header？
#   Nginx 的 add_header 有"就近覆盖"语义：一旦某个 location 里出现了任意 add_header，
#   server 级的所有 add_header（含安全头）在该 location 内会全部失效。
#   用 map 在 server 级统一输出，既避免重复书写，也不会丢安全头。
#
# 默认值 no-store 覆盖：/ 、/index.html 、/version.json 、微信验证 txt
#   —— 这正是根治"微信 X5 内核缓存导致改了看不到"的关键开关。
# ------------------------------------------------------------------------------
map $uri $ns_cache_control {
    default                                     "no-store";

    # Vite 构建产物：文件名自带内容哈希，内容变则文件名变 → 可安全永久缓存
    ~^/assets/.+\.(js|css|mjs)$                 "public, max-age=31536000, immutable";

    # 游戏美术 PNG（165 张）：固定文件名，但 URL 已带 ?v=<内容哈希> 击穿缓存
    ~^/assets/.+\.(png|jpe?g|gif|webp|avif)$    "public, max-age=31536000, immutable";

    # SVG 同 PNG 处理
    ~^/assets/.+\.svg$                          "public, max-age=31536000, immutable";

    # 自托管字体（woff2 本身已是 brotli 压缩，内容稳定）
    ~^/fonts/.+\.(woff2?|ttf|otf|eot)$          "public, max-age=31536000, immutable";
}


# --------------------------------------------------------------------------
# 云存档 API 限流（v5.13）：auth 接口严格（防爆破/刷注册），业务接口宽松
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=ns_api_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ns_api:10m    rate=20r/s;

# >>>>> NS_STAGE1_BEGIN
# ==============================================================================
# 阶段一：HTTP-only（:80 直接提供站点，无 TLS）
# 适用：全新 Ubuntu 重装后、证书还没拿到之前。
# 注意：此时是明文 HTTP，仅供验证与拿证使用，不应长期对外（验证完尽快走 --https）。
# ==============================================================================
server {
    listen 80;

    # IPv6 监听：轻量实例若未开启 IPv6，这一行会让 nginx 直接起不来
    # （nginx: [emerg] socket() [::]:80 failed (97: Address family not supported by protocol)）。
    # 确认实例已分配 IPv6 地址后再手动打开。
    # listen [::]:80;

    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # 站点根目录指向软链接 current（回滚 = 改软链接指向，秒级生效）
    root /var/www/night-survivors/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 1m;   # 纯静态站点，不需要上传

    # --------------------------------------------------------------------------
    # gzip
    #
    # ⚠️ 注意：image/png 刻意不在 gzip_types 里。
    #   PNG 已经是 DEFLATE 压缩后的二进制格式，再套一层 gzip 压缩率接近于 0，
    #   只会白白消耗 CPU（165 张图 × 每次请求）。同理排除 woff2 —— 它本身
    #   就是 brotli 压缩过的，gzip 无收益甚至可能略微变大。
    #
    #   真正有收益的是文本类：JS 231KB → 72KB，CSS 55KB → 11KB，HTML 17KB → 6KB。
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;      # 小于 1KB 不压（微信验证 txt 只有 40B，不会被压，避免踩坑）
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    access_log /var/log/nginx/night-survivors.access.log;
    error_log  /var/log/nginx/night-survivors.error.log warn;

    # 安全头（统一在 server 级输出，配合上面的 map 避免 add_header 就近覆盖问题）
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;

    # 统一输出缓存策略（值来自上面的 map，默认 no-store）
    add_header Cache-Control $ns_cache_control always;

    # --------------------------------------------------------------------------
    # ⭐ certbot HTTP-01 挑战通道（阶段一存在的最大理由）
    #   Let's Encrypt 只会访问 http://<域名>/.well-known/acme-challenge/<token>，
    #   走 80 端口、不会连 443。这一段缺失 → 拿不到证书。
    #   验证：curl -I http://<域名>/.well-known/acme-challenge/probe 应返回 404
    #         （404 说明 location 命中了；若返回 301 则说明被跳转规则吞掉，配置有误）
    # --------------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/night-survivors/current;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 微信域名验证文件（关键校验项）
    # 丢失 = 微信内链接被风控拦截。必须 200 + text/plain。
    # 源文件：public/f3cf20e70ac09eb3e2c94fba4342e616.txt
    # --------------------------------------------------------------------------
    location = /f3cf20e70ac09eb3e2c94fba4342e616.txt {
        default_type "text/plain";
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 运行时版本自检端点（src/version-check.js 每 90s 拉取，比对后弹"有新版本"横幅）
    location = /version.json {
        default_type "application/json";
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Cloudflare Pages 专有文件：Nginx 用不到，对公网隐藏
    location ~* ^/_(headers|redirects)$ {
        return 404;
    }

    # 隐藏 VCS / 备份文件（保险）
    location ~* /\.(git|svn|hg|env|DS_Store) {
        return 404;
    }

    # 静态资源：显式 try_files → 缺失资源返回真 404，便于一眼发现没传全的 PNG
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 云存档 API（v5.13）：反代本机 ns-save-api（127.0.0.1:8787，systemd: ns-save-api）
    # --------------------------------------------------------------------------
    location ^~ /api/auth/ {
        limit_req zone=ns_api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location ^~ /api/ {
        limit_req zone=ns_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # --------------------------------------------------------------------------
    # 站点根 / —— 不做 SPA fallback，理由见文件末尾 STAGE2 段落内的详细注释
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
# <<<<< NS_STAGE1_END


